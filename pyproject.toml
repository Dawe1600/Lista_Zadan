[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lista-zadan"
version = "1.1.0"
description = "Desktopowa aplikacja To-Do w PyQt5 z asystentem AI (Google Gemini)"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
