name: Propozycja funkcji
description: Zaproponuj nową funkcję lub ulepszenie aplikacji
title: "[Feature]: "
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Jaki problem rozwiązuje ta propozycja?
      description: Opisz krótko kontekst lub brakującą możliwość.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proponowane rozwiązanie
      description: Jak funkcja powinna działać z perspektywy użytkownika?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Dodatkowy kontekst
      description: Ewentualne makiety, przykłady lub uwagi (opcjonalnie).
